<!DOCTYPE html>
<html>
<head>
<title>Arm 3D Control</title>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
  #canvas-container { flex: 1; }
  #controls { width: 320px; padding: 20px; background: #f4f4f4; overflow-y: auto; box-sizing: border-box; }
  #controls h2 { font-size: 16px; margin-top: 0; }
  .slider-row { margin-bottom: 16px; }
  .slider-row label { display: block; font-size: 13px; margin-bottom: 4px; color: #333; }
  .slider-row input[type=range] { width: 100%; }
  .slider-row .value { font-size: 12px; color: #666; }
  #status { padding: 8px; margin-bottom: 16px; border-radius: 4px; font-size: 13px; }
  .connected { background: #d4edda; color: #155724; }
  .disconnected { background: #f8d7da; color: #721c24; }
  #reset-btn { width: 100%; padding: 12px; background: #ffdddd; border: none; border-radius: 4px;
               font-size: 14px; cursor: pointer; margin-top: 10px; }
  #reset-btn:hover { background: #ffcccc; }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="controls">
  <h2>Arm 3D Control</h2>
  <div id="status" class="disconnected">Connecting to bridge...</div>

  <div class="slider-row">
    <label>Grip open/close (ch11)</label>
    <input type="range" id="slider-11" min="0" max="180" value="90">
    <div class="value" id="value-11">90</div>
  </div>
  <div class="slider-row">
    <label>Grip rotation - twists like a screwdriver (ch15)</label>
    <input type="range" id="slider-15" min="20" max="100" value="60">
    <div class="value" id="value-15">60</div>
  </div>
  <div class="slider-row">
    <label>Topmost hinge (ch4)</label>
    <input type="range" id="slider-4" min="20" max="160" value="90">
    <div class="value" id="value-4">90</div>
  </div>
  <div class="slider-row">
    <label>2nd hinge - bends L/R, perpendicular plane (ch7)</label>
    <input type="range" id="slider-7" min="50" max="160" value="105">
    <div class="value" id="value-7">105</div>
  </div>
  <div class="slider-row">
    <label>3rd hinge (ch12)</label>
    <input type="range" id="slider-12" min="20" max="160" value="90">
    <div class="value" id="value-12">90</div>
  </div>
  <div class="slider-row">
    <label>Bottom hinge (ch3/ch8 mirrored)</label>
    <input type="range" id="slider-bottom" min="-55" max="55" value="0">
    <div class="value" id="value-bottom">0</div>
  </div>
  <div class="slider-row">
    <label>Base rotation (ch0)</label>
    <input type="range" id="slider-0" min="0" max="180" value="90">
    <div class="value" id="value-0">90</div>
  </div>

  <button id="reset-btn">Reset to calibration</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ---------------- Calibration centers (must match the Arduino sketch) ----------------
const CENTER = { 0: 90, 3: 75, 8: 105, 4: 90, 7: 105, 11: 90, 12: 90, 15: 60 };

// ---------------- Target values (what the sliders/UI want) ----------------
let targets = {
  base: 90,      // ch0
  bottom: 0,     // offset, drives ch3/ch8 mirrored
  third: 90,     // ch12
  ch7: 105,      // ch7
  topmost: 90,   // ch4
  gripRotate: 60,// ch15
  grip: 90,      // ch11
};

// ---------------- Current values (what's actually being displayed/sent - eases toward target) ----------------
let current = { ...targets };

const MAX_STEP_PER_TICK = 1.5;  // degrees per tick - lower = gentler/slower

// ---------------- WebSocket connection to the local bridge ----------------
let ws = null;
let wsReady = false;

function connectWS() {
  ws = new WebSocket("ws://localhost:8765");
  ws.onopen = () => {
    wsReady = true;
    document.getElementById("status").textContent = "Connected to bridge";
    document.getElementById("status").className = "connected";
  };
  ws.onclose = () => {
    wsReady = false;
    document.getElementById("status").textContent = "Disconnected - retrying...";
    document.getElementById("status").className = "disconnected";
    setTimeout(connectWS, 1500);
  };
  ws.onerror = () => { /* onclose handles retry */ };
}
connectWS();

function sendChannel(channel, angle) {
  if (wsReady) {
    ws.send(JSON.stringify({ channel: channel, angle: Math.round(angle) }));
  }
}

// ---------------- Three.js scene setup ----------------
const container = document.getElementById("canvas-container");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeeeeee);

const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);
camera.position.set(8, 6, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3, 0);
controls.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);

const grid = new THREE.GridHelper(20, 20, 0xcccccc, 0xdddddd);
scene.add(grid);

// ---------------- Kinematic chain ----------------
// Segment lengths (arbitrary 3D units, proportional to the real link lengths)
const L_BOTTOM = 2.75, L_THIRD = 2.25, L_CH7 = 2.25, L_TOPMOST = 1.75, L_GRIP = 1.3;

function makeSegment(length, color) {
  const geo = new THREE.CylinderGeometry(0.18, 0.18, length, 12);
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: color }));
  mesh.position.y = length / 2;  // so the segment extends from the group's origin upward
  return mesh;
}

function makeJointMarker(color) {
  const geo = new THREE.SphereGeometry(0.22, 12, 12);
  return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: color }));
}

// Base group - rotates around Y (yaw), sits at the world origin
const baseGroup = new THREE.Group();
scene.add(baseGroup);
baseGroup.add(makeJointMarker(0x888888));

// Bottom hinge - bends around Z, child of base
const bottomHingeGroup = new THREE.Group();
baseGroup.add(bottomHingeGroup);
bottomHingeGroup.add(makeSegment(L_BOTTOM, 0x4a86e8));

// 3rd hinge - bends around Z, positioned at the end of the bottom segment
const thirdHingeGroup = new THREE.Group();
thirdHingeGroup.position.y = L_BOTTOM;
bottomHingeGroup.add(thirdHingeGroup);
thirdHingeGroup.add(makeSegment(L_THIRD, 0x4a86e8));

// ch7 - BENDS around X (a hinge, like the others, but in the perpendicular plane -
// this swings everything above it left/right instead of up/down) - positioned at
// end of 3rd hinge segment
const ch7Group = new THREE.Group();
ch7Group.position.y = L_THIRD;
thirdHingeGroup.add(ch7Group);
const ch7Segment = makeSegment(L_CH7, 0xe8a84a);  // different color - bends on a different axis than the other hinges
ch7Group.add(ch7Segment);

// Topmost hinge - bends around Z, positioned at end of ch7 segment
const topmostHingeGroup = new THREE.Group();
topmostHingeGroup.position.y = L_CH7;
ch7Group.add(topmostHingeGroup);
topmostHingeGroup.add(makeSegment(L_TOPMOST, 0x4a86e8));

// Grip rotation - TWISTS around Y, positioned at end of topmost segment
const gripRotateGroup = new THREE.Group();
gripRotateGroup.position.y = L_TOPMOST;
topmostHingeGroup.add(gripRotateGroup);
const gripRotateMarker = makeJointMarker(0xcc0000);
gripRotateMarker.position.set(0, 0, 0);
gripRotateGroup.add(gripRotateMarker);

// Gripper - forms an "upside-down L" with the arm: this bar sticks out
// SIDEWAYS (perpendicular to the arm's own direction) from the tip, like the
// horizontal top of an upside-down L. Two parallel bars, separated in depth (Z),
// move apart/together for opening and closing.
const fingerGeo = new THREE.BoxGeometry(L_GRIP, 0.15, 0.2);
const fingerMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
const fingerTop = new THREE.Mesh(fingerGeo, fingerMat);
const fingerBottom = new THREE.Mesh(fingerGeo, fingerMat);
fingerTop.position.x = L_GRIP / 2;   // extends sideways from the tip, not upward
fingerBottom.position.x = L_GRIP / 2;
gripRotateGroup.add(fingerTop);
gripRotateGroup.add(fingerBottom);

function updateScene() {
  baseGroup.rotation.y = THREE.MathUtils.degToRad(current.base - CENTER[0]);
  bottomHingeGroup.rotation.z = THREE.MathUtils.degToRad(current.bottom);
  thirdHingeGroup.rotation.z = THREE.MathUtils.degToRad(current.third - CENTER[12]);
  ch7Group.rotation.x = THREE.MathUtils.degToRad(current.ch7 - CENTER[7]);
  topmostHingeGroup.rotation.z = THREE.MathUtils.degToRad(current.topmost - CENTER[4]);
  gripRotateGroup.rotation.x = THREE.MathUtils.degToRad(current.gripRotate - CENTER[15]);

  const gripOpenAmount = (current.grip / 180) * 0.25;  // 0 to 0.25 units apart, in depth (Z)
  fingerTop.position.z = 0.08 + gripOpenAmount;
  fingerBottom.position.z = -0.08 - gripOpenAmount;
}

// ---------------- Slider wiring ----------------
function wireSlider(id, targetKey, sendChannelId, mirrored) {
  const slider = document.getElementById(id);
  const valueLabel = document.getElementById("value-" + id.replace("slider-", ""));
  slider.addEventListener("input", () => {
    const v = parseFloat(slider.value);
    targets[targetKey] = v;
    valueLabel.textContent = v;
  });
}

wireSlider("slider-11", "grip");
wireSlider("slider-15", "gripRotate");
wireSlider("slider-4", "topmost");
wireSlider("slider-7", "ch7");
wireSlider("slider-12", "third");
wireSlider("slider-bottom", "bottom");
wireSlider("slider-0", "base");

document.getElementById("reset-btn").addEventListener("click", () => {
  targets = { base: 90, bottom: 0, third: 90, ch7: 105, topmost: 90, gripRotate: 60, grip: 90 };
  document.getElementById("slider-0").value = 90;
  document.getElementById("slider-bottom").value = 0;
  document.getElementById("slider-12").value = 90;
  document.getElementById("slider-7").value = 105;
  document.getElementById("slider-4").value = 90;
  document.getElementById("slider-15").value = 60;
  document.getElementById("slider-11").value = 90;
  document.getElementById("value-0").textContent = 90;
  document.getElementById("value-bottom").textContent = 0;
  document.getElementById("value-12").textContent = 90;
  document.getElementById("value-7").textContent = 105;
  document.getElementById("value-4").textContent = 90;
  document.getElementById("value-15").textContent = 60;
  document.getElementById("value-11").textContent = 90;
});

// ---------------- Smoothing tick: eases `current` toward `targets`, sends over WebSocket ----------------
function smoothingTick() {
  for (const key in targets) {
    const diff = targets[key] - current[key];
    if (Math.abs(diff) < 0.01) { current[key] = targets[key]; continue; }
    const step = Math.max(-MAX_STEP_PER_TICK, Math.min(MAX_STEP_PER_TICK, diff));
    current[key] += step;
  }

  // Send whichever channels actually correspond to physical servos
  sendChannel(0, current.base);
  const ch3 = CENTER[3] + current.bottom;
  const ch8 = CENTER[8] - current.bottom;
  sendChannel(3, ch3);
  sendChannel(8, ch8);
  sendChannel(12, current.third);
  sendChannel(7, current.ch7);
  sendChannel(4, current.topmost);
  sendChannel(15, current.gripRotate);
  sendChannel(11, current.grip);

  updateScene();
}
setInterval(smoothingTick, 20);

// ---------------- Render loop ----------------
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});
</script>
</body>
</html>
